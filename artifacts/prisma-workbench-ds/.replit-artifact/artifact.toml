kind = "design-system"
previewPath = "/prisma-workbench-ds/"
title = "PRISMA 2020 Workbench Design System"
description = "A reusable design system extracted from the PRISMA 2020 Workbench: an evidence-focused systematic-review workspace with academic typography, indigo workflow accents, slate surfaces, structured cards, compact data tables, and cautious status signaling."
version = "1.0.0"
id = "artifacts/prisma-workbench-ds"
router = "path"

[[services]]
name = "web"
paths = [ "/prisma-workbench-ds/" ]
localPort = 21492

[services.development]
run = "pnpm --filter @workspace/prisma-workbench-ds run dev"

[services.env]
PORT = "21492"
BASE_PATH = "/prisma-workbench-ds/"
