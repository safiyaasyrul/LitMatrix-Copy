kind = "web"
previewPath = "/"
title = "PRISMA 2020 Workbench"
description = "A systematic literature review workbench for PRISMA, PRISMA-S, and ROSES reporting, evidence synthesis, risk of bias, and manuscript generation."
version = "1.0.0"
id = "artifacts/litmatrix"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22863

[services.development]
run = "pnpm --filter @workspace/litmatrix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/litmatrix", "run", "build" ]
serve = "static"
publicDir = "artifacts/litmatrix/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22863"
BASE_PATH = "/"
