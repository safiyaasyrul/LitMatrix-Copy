kind = "web"
previewPath = "/"
title = "ScholarPen"
description = "A full-stack systematic literature review workspace for organizing, screening, synthesizing, and drafting scholarly research."
version = "1.0.0"
id = "artifacts/litmatrix"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22863

[services.development]
run = "pnpm --filter @workspace/litmatrix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/litmatrix", "run", "build" ]
serve = "static"
publicDir = "artifacts/litmatrix/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22863"
BASE_PATH = "/"
